name: Unity EditMode Tests

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'Assets/**'
      - 'Packages/**'
      - 'ProjectSettings/**'
      - '.github/workflows/unity-editmode-tests.yml'

jobs:
  editmode-tests:
    name: Unity EditMode tests
    runs-on: ubuntu-latest
    env:
      HAS_UNITY_LICENSE: ${{ secrets.UNITY_LICENSE != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Explain Unity test skip
        if: env.HAS_UNITY_LICENSE != 'true'
        run: |
          echo "Unity EditMode tests require UNITY_LICENSE/UNITY_EMAIL/UNITY_PASSWORD secrets."
          echo "Static portfolio validation still runs on push through portfolio-validation.yml."

      - name: Run Unity EditMode tests
        if: env.HAS_UNITY_LICENSE == 'true'
        uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          testMode: EditMode
          artifactsPath: unity-test-artifacts
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Unity test artifacts
        uses: actions/upload-artifact@v4
        if: always() && env.HAS_UNITY_LICENSE == 'true'
        with:
          name: mayatounity-editmode-test-artifacts
          path: unity-test-artifacts
